version: "3.9"
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: adminpass
      POSTGRES_USER: admin
      POSTGRES_DB: broker
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d broker || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command:
      - "dragonfly"
      - "--dbnum=16"
      - "--requirepass=adminpass"
      - "--logtostdout"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "adminpass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  valkey:
    image: valkey/valkey:9.1.0
    command: ["valkey-server", "--requirepass", "adminpass", "--databases", "16"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "adminpass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  broker:
    volumes:
      - ./dev/broker-clients.yml:/run/configs/broker_policy.yml:ro
      - ./.local/broker-auth/master:/run/secrets/broker_master:ro
    build:
      context: .
      network: host
    environment:
      AUTH_MODE: token
      AUTH_POLICY_FILE: /run/configs/broker_policy.yml
      AUTH_DEPLOYMENT_ID: broker-development
      AUTH_KEY_FILES: dev1=/run/secrets/broker_master
      POSTGRES_URI: postgres://admin:adminpass@postgres:5432/broker?sslmode=disable
      DRAGONFLY_URI: redis://:adminpass@dragonfly:6379/0
      VALKEY_URI: redis://:adminpass@valkey:6379/0
      SERVICE_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
